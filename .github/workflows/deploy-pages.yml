# GitHub Pages deploy. Separate from verify.yml: different trigger (push to main only, not
# every PR) and different risk profile (has side effects). Relies on the branch ruleset
# having already required verify.yml's checks to pass before this push landed on main --
# not on an in-workflow `needs:` dependency, since that would require a cross-file
# workflow_run hand-off (and the artifact-poisoning caution that comes with it) that isn't
# worth it here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: danibsheehan/dani-actions/.github/workflows/deploy-github-pages.yml@v17
    with:
      build-command: >-
        VITE_SUPABASE_URL="$BUILD_SECRET_1"
        VITE_SUPABASE_ANON_KEY="$BUILD_SECRET_2"
        VITE_AI_SERVICE_URL="$BUILD_SECRET_3"
        npm run build
      dist-path: dist
      spa-fallback: true
    secrets:
      build-secret-1: ${{ secrets.VITE_SUPABASE_URL }}
      build-secret-2: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      build-secret-3: ${{ secrets.VITE_AI_SERVICE_URL }}
