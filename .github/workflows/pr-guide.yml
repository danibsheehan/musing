# Sticky PR guide comment + path labels. Non-blocking; separate from verify.
name: PR guide

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-guide-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guide:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: danibsheehan/dani-actions/.github/workflows/pr-guide.yml@v17
    with:
      labels: |
        [{"name": "area: editor", "color": "bfdadc", "description": "TipTap editor, blocks, slash menu, links, or serialization"},
         {"name": "area: sync", "color": "c5def5", "description": "Workspace persistence, Supabase, or auth"},
         {"name": "area: database", "color": "d4c5f9", "description": "Database embed behavior"},
         {"name": "area: export", "color": "fef2c0", "description": "PDF or DOCX export"},
         {"name": "area: app", "color": "c2e0c6", "description": "App shell, layout, or routing"},
         {"name": "area: tests", "color": "fbca04", "description": "Test files or test tooling"},
         {"name": "area: ci", "color": "f9d0c4", "description": "GitHub Actions or PR automation"},
         {"name": "area: docs", "color": "eaeef2", "description": "Documentation or agent guidance"},
         {"name": "area: config", "color": "d1d5da", "description": "Dependencies or tooling configuration"}]
