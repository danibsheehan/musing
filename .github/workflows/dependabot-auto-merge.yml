# Delegates to the reusable workflow in dani-actions, shared across personal
# project repos, so a fix or improvement lands once instead of being
# hand-copied into every repo.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: danibsheehan/dani-actions/.github/workflows/dependabot-auto-merge.yml@v10
