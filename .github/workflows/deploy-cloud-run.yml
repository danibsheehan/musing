# Deploys service/ (musing-ai-service) to Cloud Run on push to main. This is separate
# GCP/Cloud Run infra from GitHub Pages (deploy-pages.yml); the two are unrelated hosts
# fronted by a shared domain — see AGENTS.md / musing-project.mdc.
name: Deploy musing-ai-service

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - ".github/workflows/deploy-cloud-run.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: danibsheehan/dani-actions/.github/workflows/deploy-cloud-run.yml@feat/deploy-cloud-run
    with:
      service-name: ${{ vars.CLOUDRUN_SERVICE_NAME }}
      region: ${{ vars.GCP_REGION }}
      project-id: ${{ vars.GCP_PROJECT_ID }}
      artifact-repository: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      deploy-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      runtime-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      source-path: service
      startup-probe-path: /health
      smoke-check-paths: '["/health"]'
      env-vars-json: >-
        {"CHAT_MODEL": "${{ vars.CHAT_MODEL }}",
        "EMBEDDING_MODEL": "${{ vars.EMBEDDING_MODEL }}",
        "AI_MONTHLY_TOKEN_CAP": "${{ vars.AI_MONTHLY_TOKEN_CAP }}",
        "AI_MONTHLY_REQUEST_CAP": "${{ vars.AI_MONTHLY_REQUEST_CAP }}",
        "AI_MAX_QPS": "${{ vars.AI_MAX_QPS }}",
        "VOYAGE_MONTHLY_TOKEN_CAP": "${{ vars.VOYAGE_MONTHLY_TOKEN_CAP }}",
        "VOYAGE_MONTHLY_REQUEST_CAP": "${{ vars.VOYAGE_MONTHLY_REQUEST_CAP }}",
        "SUPABASE_URL": "${{ vars.SUPABASE_URL }}",
        "ALLOWED_ORIGINS": "${{ vars.ALLOWED_ORIGINS }}"}
      gcp-secrets-json: >-
        {"SUPABASE_SERVICE_ROLE_KEY": "SUPABASE_SERVICE_ROLE_KEY:latest",
        "ANTHROPIC_API_KEY": "ANTHROPIC_API_KEY:latest",
        "VOYAGE_API_KEY": "VOYAGE_API_KEY:latest"}
