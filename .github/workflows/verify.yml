# Parallel PR/push verification jobs (format/doc-checks/lint/audit/typecheck/test/build),
# via dani-actions' shared npm-verify.yml. Deploy lives in deploy-pages.yml/
# deploy-cloud-run.yml -- separate files, different triggers (push to main only) and
# different risk profile (side effects).

name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: danibsheehan/dani-actions/.github/workflows/npm-verify.yml@v12
    with:
      packages: |
        [{"name": "app", "path": ".",
          "test-command": "npm run test:coverage",
          "build-command": "npm run build",
          "coverage-file": "coverage/cobertura-coverage.xml",
          "typecheck-command": "npm run typecheck",
          "paths": "app:\n  - 'src/**'\n  - 'public/**'\n  - 'index.html'\n  - 'package.json'\n  - 'package-lock.json'\n  - 'tsconfig*.json'\n  - 'vite.config.ts'\n  - 'eslint.config.js'\n  - '.prettierrc*'\n  - '.prettierignore'\n  - '.nvmrc'\n  - '.github/workflows/**'\n  - '.github/dependabot.yml'"},
         {"name": "service", "path": "service",
          "test-command": "npm run test:run",
          "build-command": "npm run build",
          "paths": "app:\n  - 'service/**'\n  - '.github/workflows/**'"}]
      doc-check-commands: |
        [{"name": "stack-docs", "command": "python3 .github/scripts/check_stack_docs.py"}]
